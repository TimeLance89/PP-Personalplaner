<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#101214">
  <title>PP – Personalplaner</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/settings.css">
  <link rel="stylesheet" href="/static/warehouse.css">
  <link rel="stylesheet" href="/static/autonomy.css">
</head>
<body>
  <div id="toast" class="toast" hidden></div>

  <main id="authShell" class="auth-shell">
    <section class="auth-card">
      <div class="brand large"><span>PP</span><strong>Personalplaner</strong></div>
      <p class="muted">People Operations für den Warehouse-Einsatz von Zeitarbeitspersonal.</p>

      <form id="loginForm" class="stack">
        <h1>Anmelden</h1>
        <label>Benutzername<input name="username" autocomplete="username" required></label>
        <label>Passwort<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Anmelden</button>
      </form>

      <form id="setupForm" class="stack" hidden>
        <h1>Ersteinrichtung</h1>
        <p class="notice">Beim ersten Start wird ein Setup-Token in <code>data/setup-token.txt</code> abgelegt und einmal im Container-Log ausgegeben.</p>
        <label>Setup-Token<input name="token" autocomplete="off" required></label>
        <label>Administratorname<input name="display_name" required></label>
        <label>Benutzername<input name="username" autocomplete="username" required></label>
        <label>Passwort<input name="password" type="password" minlength="10" autocomplete="new-password" required></label>
        <button class="primary" type="submit">Administrator anlegen</button>
      </form>
    </section>
  </main>

  <div id="appShell" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand"><span>PP</span><strong>Personalplaner</strong></div>
      <nav id="mainNav">
        <button data-view="dashboard" class="active">Übersicht</button>
        <button data-view="workers">Personal</button>
        <button data-view="offboardings">Abmeldungen</button>
        <button data-view="admin" data-admin-only>Verwaltung</button>
        <button data-view="audit" data-admin-only>Aktivitäten</button>
      </nav>
      <div class="sidebar-footer">
        <div id="userBadge"></div>
        <button id="logoutBtn" class="ghost">Abmelden</button>
      </div>
    </aside>

    <section class="content">
      <header class="topbar">
        <div>
          <p id="eyebrow" class="eyebrow">People Operations</p>
          <h1 id="viewTitle">Control Tower</h1>
        </div>
        <div id="contextBadge" class="context-badge"></div>
      </header>

      <section id="view-dashboard" class="view"></section>
      <section id="view-workers" class="view" hidden></section>
      <section id="view-offboardings" class="view" hidden></section>
      <section id="view-admin" class="view" hidden></section>
      <section id="view-audit" class="view" hidden></section>
    </section>
  </div>

  <dialog id="modal"><form method="dialog" class="modal-card"><div id="modalBody"></div></form></dialog>
  <script src="/static/app.js" defer></script>
  <script src="/static/warehouse_ui.js" defer></script>
  <script src="/static/autonomy_ui.js" defer></script>
</body>
</html>
