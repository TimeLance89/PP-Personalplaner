services:
  pp-personalplaner:
    build: .
    image: pp-personalplaner:latest
    container_name: pp-personalplaner
    restart: unless-stopped
    init: true
    user: "1000:10"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    ports:
      - "8780:8780"
    volumes:
      - ./data:/app/data
    environment:
      PP_DATA_DIR: /app/data
      PP_HOST: 0.0.0.0
      PP_PORT: 8780
      TZ: Europe/Berlin
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
      - /home/pp:rw,nosuid,nodev,size=32m,mode=0700,uid=1000,gid=10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
